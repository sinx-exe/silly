<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Discord</title>
    <link rel="icon" type="image/png" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQcQ8tYaEeiDXpWmHP4wAe0PviqoJaCxijZP5msiCFKOg&s=10">
	<style>
		:root { --rgb: #ff0055; }
		* { box-sizing: border-box; }
		html, body { height: 100%; margin: 0; }
		body {
			display: grid;
			place-items: center;
			overflow: hidden;
			color: white;
			font: 700 clamp(1.2rem, 3vw, 2rem)/1.4 system-ui, sans-serif;
			background: var(--rgb);
			transition: background-color .08s linear;
		}
		main { text-align: center; text-shadow: 0 2px 8px #000; }
		button { margin-top: 1rem; padding: .75rem 1.25rem; font: inherit; cursor: pointer; }
		#status { font-size: 1rem; }
	</style>
</head>
<body>
	<main>
		<div>RGB SIREN</div>
		<button id="sound" type="button">Start sound</button>
		<p id="status" role="status">Click Start sound to enable audio.</p>
	</main>
	<script>
		let audioContext, oscillator, gain, sirenTimer;
		let sirenStarted = false;
		const soundButton = document.querySelector('#sound');
		const status = document.querySelector('#status');

		let hue = 0;
		function rgbLoop() {
			hue = (hue + 8) % 360;
			document.documentElement.style.setProperty('--rgb', `hsl(${hue} 100% 50%)`);
			requestAnimationFrame(rgbLoop);
		}
		rgbLoop();

		async function startSiren() {
			audioContext ||= new (window.AudioContext || window.webkitAudioContext)();
			await audioContext.resume();
			if (audioContext.state !== 'running') throw new Error('Audio did not start. Click Start sound to retry.');
			if (sirenStarted) return;
			oscillator = audioContext.createOscillator();
			gain = audioContext.createGain();
			oscillator.type = 'sawtooth';
			oscillator.frequency.value = 650;
			gain.gain.value = 0.18;
			oscillator.connect(gain).connect(audioContext.destination);
			oscillator.start();
			sirenStarted = true;
			let high = false;
			sirenTimer = setInterval(() => {
				high = !high;
				oscillator.frequency.setTargetAtTime(high ? 1050 : 650, audioContext.currentTime, .08);
			}, 700);
		}

		soundButton.addEventListener('click', async () => {
			soundButton.disabled = true;
			try {
				if (sirenStarted) {
					clearInterval(sirenTimer);
					oscillator.stop();
					oscillator.disconnect();
					gain.disconnect();
					sirenStarted = false;
					soundButton.textContent = 'Start sound';
					status.textContent = 'Sound stopped.';
				} else {
					await startSiren();
					soundButton.textContent = 'Stop sound';
					status.textContent = 'Siren playing.';
				}
			} catch (error) {
				status.textContent = `Unable to play sound: ${error.message}`;
			} finally {
				soundButton.disabled = false;
			}
		});



        
	</script>
</body>
</html>
