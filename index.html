<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ff0000">
  <title>RGB / Siren</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: #f00; animation: rgb 360ms steps(1, end) infinite; }
    @keyframes rgb {
      0%, 100% { background-color: #f00; }
      33.333% { background-color: #0f0; }
      66.666% { background-color: #00f; }
    }
    button {
      position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
      padding: 18px 28px; border: 1px solid #ffffff70; border-radius: 999px;
      background: #111; color: #fff; font: 600 16px/1.2 system-ui, sans-serif;
      cursor: pointer; white-space: nowrap;
    }
    button:focus-visible { outline: 3px solid white; outline-offset: 5px; }
    [hidden] { display: none; }
  </style>
</head>
<body>
  <button id="enable" type="button" hidden>Enable sound</button>
  <script>
    const enable = document.querySelector('#enable');
    let context;
    try {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      context = new AudioContext();
      const tone = context.createOscillator();
      const sweep = context.createOscillator();
      const sweepDepth = context.createGain();
      const volume = context.createGain();
      tone.type = 'sawtooth';
      tone.frequency.value = 850;
      sweep.type = 'sine';
      sweep.frequency.value = 0.8;
      sweepDepth.gain.value = 450;
      volume.gain.value = 0.3;
      sweep.connect(sweepDepth);
      sweepDepth.connect(tone.frequency);
      tone.connect(volume);
      volume.connect(context.destination);
      sweep.start();
      tone.start();
      function updateButton() { enable.hidden = context.state === 'running'; }
      context.addEventListener('statechange', updateButton);
      enable.addEventListener('click', async () => {
        try { await context.resume(); } catch (_) { /* Allow another click. */ }
        updateButton();
      });
      updateButton();
      context.resume().then(updateButton).catch(updateButton);
    } catch (_) {
      enable.hidden = false;
      enable.textContent = 'Audio unavailable in this browser';
      enable.disabled = true;
    }
  </script>
</body>
</html>
